server:
  port: 8091
spring:
  datasource:
    url: jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: demo
  sql:
    init:
      mode: always
      data-locations: classpath:data-demo.sql
  jpa:
    defer-datasource-initialization: true
